[package]
name = "a1"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
http-reqwest = ["dep:reqwest", "dep:rustls"]
http-hyper = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls", "dep:rustls"]
http-ureq = ["dep:ureq"]
conv-htmd = ["dep:htmd"]
conv-html2md = ["dep:html2md"]
conv-html2text = ["dep:html2text"]
conv-none = []
conv-lolhtml = ["dep:lol_html"]
mimalloc = ["dep:mimalloc"]

[dependencies]
rmcp = { version = "3.4.0", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "net", "time"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
htmd = { version = "0.5", optional = true }
html2md = { version = "0.2", optional = true }
html2text = { version = "0.17", optional = true }
lol_html = { version = "2", optional = true }
mimalloc = { version = "0.1", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
