name: arm-bench

# Advisory native-aarch64 measurement on a GitHub-hosted arm64 runner: job `bench` measures the A-1 spike (Sprint 0
# gate G0 evidence); job `bench-product` (A-3a) builds and measures the REAL fetch-mcp release binary (idle RSS and
# ready_ms, recorded not gated; the PRD 250 ms readiness figure is evidence only, the harness does not enforce it).
# NEITHER is a required check: job ids are `bench`, `bench-product` and `bench-product-peak` (A-3b RSS smoke, bench-loopback build), none of fmt/clippy/test/deny/release-guard. Never uses --gate: the spike is a
# stand-in, not fetch-mcp, so the harness's gate identity rules (rightly) refuse it. Numbers are spike evidence only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/**"
      - "spikes/a1/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/arm-bench.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench (${{ matrix.libc }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    continue-on-error: ${{ matrix.libc == 'musl' }}
    strategy:
      fail-fast: false
      matrix:
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Platform facts
        run: |
          set -eu
          mkdir -p out
          {
            echo "uname -a: $(uname -a)"
            echo "kernel: $(uname -r)"
            echo "machine: $(uname -m)"
            echo "cpu: $(grep -m1 -E '^(model name|Model|Hardware|CPU part)' /proc/cpuinfo || true)"
            echo "cpu_part: $(grep -m1 'CPU part' /proc/cpuinfo || true)"
            echo "nproc: $(nproc)"
            echo "MemTotal: $(grep MemTotal /proc/meminfo)"
            echo "PAGESIZE: $(getconf PAGESIZE)"
            echo "glibc: $(getconf GNU_LIBC_VERSION)"
            echo "thp: $(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo unknown)"
            echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "runner name: ${RUNNER_NAME:-unknown} arch=${RUNNER_ARCH:-unknown}"
            echo "binfmt: $(find /proc/sys/fs/binfmt_misc -type f 2>/dev/null | tr "\n" " ")"
          } | tee "out/platform-${{ matrix.libc }}.txt"

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Build spike (reqwest + lol_html streaming, --locked)
        working-directory: spikes/a1
        run: |
          set -eu
          if [ "${{ matrix.libc }}" = musl ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
            export CC_aarch64_unknown_linux_musl=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            cargo build --release --locked --target aarch64-unknown-linux-musl --features http-reqwest,conv-lolhtml
            cp target/aarch64-unknown-linux-musl/release/a1 "$RUNNER_TEMP/a1"
          else
            cargo build --release --locked --features http-reqwest,conv-lolhtml
            cp target/release/a1 "$RUNNER_TEMP/a1"
          fi
          file "$RUNNER_TEMP/a1" | tee -a "$GITHUB_WORKSPACE/out/platform-${{ matrix.libc }}.txt"
          sha256sum "$RUNNER_TEMP/a1" | tee -a "$GITHUB_WORKSPACE/out/platform-${{ matrix.libc }}.txt"

      - name: Wrapper binaries (the harness needs a --version; exec keeps the spike as the measured pid)
        run: |
          set -eu
          # shellcheck disable=SC2016
          mk() { # name marker
            printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "a1-spike 0.0.0 (A-1 stand-in, NOT fetch-mcp) %s"; exit 0; fi\nexec %s/a1 "$@"\n' "$2" "$RUNNER_TEMP" > "$RUNNER_TEMP/$1"
            chmod +x "$RUNNER_TEMP/$1"
          }
          mk a1-shipped ""
          mk a1-bench "bench-loopback"

      - name: Generate fixtures and self-test the harness
        run: |
          set -eu
          python3 bench/fixtures.py generate
          python3 bench/selftest.py

      - name: Run E-1 harness (advisory, 10 runs, 30 s idle settle)
        run: |
          set -u
          : > out/results-${{ matrix.libc }}.jsonl
          rc=0
          python3 bench/measure.py --binary "$RUNNER_TEMP/a1-shipped" --binary-kind shipped --scenario idle \
            --out out/results-${{ matrix.libc }}.jsonl > /dev/null || rc=$?
          echo "idle exit=$rc"; r1=$rc; rc=0
          python3 bench/measure.py --binary "$RUNNER_TEMP/a1-bench" --binary-kind bench \
            --scenario g4a-5mib-full --scenario g4a-5mib-gz \
            --out out/results-${{ matrix.libc }}.jsonl > /dev/null || rc=$?
          echo "5mib exit=$rc"
          echo "idle_exit=$r1 peak_exit=$rc" > out/exitcodes-${{ matrix.libc }}.txt
          # exit 1 = a target missed (a result, reported below); 2/3 = invalid or refused (plumbing failure)
          [ "$r1" -le 1 ] && [ "$rc" -le 1 ]

      - name: Job summary
        if: always()
        run: |
          python3 - "${{ matrix.libc }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          libc = sys.argv[1]
          print(f"## arm-bench ({libc}): A-1 spike on hosted arm64, ADVISORY (spike is not the product, not a gate run)\n")
          print("```\n" + open(f"out/platform-{libc}.txt").read() + "```\n")
          print("| scenario | metric | valid/runs | median MiB | min-max MiB | verdict |\n|---|---|---|---|---|---|")
          tim = []
          try:
              for l in open(f"out/results-{libc}.jsonl"):
                  o = json.loads(l)
                  if o.get("kind") == "scenario":
                      v = o.get("samples_kB") or [0]
                      print(f"| {o['scenario']} | {o['metric']} | {o['valid_runs']}/{o['runs']} | {o.get('median_MiB','n/a')} | {min(v)/1024:.2f}-{max(v)/1024:.2f} | {o['verdict']} {o.get('invalid_reasons') or ''} |")
                      tim.append(o)
                  elif o.get("kind") == "summary":
                      print(f"\nsummary: {o.get('verdict')} {o.get('reason','')} (gating={o.get('gating')})")
          except OSError as e:
              print(f"no results: {e}")
          # timings are recorded, NOT gated (ADR-007); milliseconds, median over valid samples (min-max)
          if tim:
              print("\n### Timings (ms, median over valid samples, min-max; recorded not gated, advisory)\n")
              print("| scenario | ready | tools/list | first byte | fetch | total |\n|---|---|---|---|---|---|")
              for o in tim:
                  t = o.get("timings", {})
                  cell = lambda k: f"{t[k]['median']} ({t[k]['min']}-{t[k]['max']})" if k in t else "n/a"
                  print(f"| {o['scenario']} | " + " | ".join(cell(k) for k in ("ready_ms", "tools_list_ms", "first_byte_ms", "fetch_ms", "total_ms")) + " |")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arm-bench-${{ matrix.libc }}
          path: out/
          if-no-files-found: warn

  # The real product (not the spike): shipped release binary, native aarch64, gnu. Idle RSS via the E-1 harness and
  # ready_ms (spawn to initialize result). Advisory: no --gate, exit 1 (target missed) is reported, not fatal.
  bench-product:
    name: bench-product (fetch-mcp, gnu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Platform facts
        run: |
          set -eu
          mkdir -p out
          {
            echo "machine: $(uname -m)"
            echo "kernel: $(uname -r)"
            echo "cpu: $(grep -m1 -E '^(model name|Model|Hardware|CPU part)' /proc/cpuinfo || true)"
            echo "nproc: $(nproc)"
            echo "MemTotal: $(grep MemTotal /proc/meminfo)"
            echo "PAGESIZE: $(getconf PAGESIZE)"
            echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "binfmt: $(find /proc/sys/fs/binfmt_misc -type f 2>/dev/null | tr "\n" " ")"
          } | tee out/platform-product.txt

      - run: rustup show active-toolchain

      - name: Build the real fetch-mcp release binary (--locked, default features)
        run: |
          set -eu
          cargo build --release --locked
          file target/release/fetch-mcp | tee -a out/platform-product.txt
          sha256sum target/release/fetch-mcp | tee -a out/platform-product.txt
          target/release/fetch-mcp --version | tee -a out/platform-product.txt

      - name: Generate fixtures and self-test the harness
        run: |
          set -eu
          python3 bench/fixtures.py generate
          python3 bench/selftest.py

      - name: Idle RSS and ready_ms (advisory, 10 runs, 30 s settle)
        run: |
          set -u
          : > out/results-product.jsonl
          rc=0
          python3 bench/measure.py --binary target/release/fetch-mcp --binary-kind shipped --scenario idle \
            --out out/results-product.jsonl || rc=$?
          echo "idle exit=$rc" | tee out/exitcodes-product.txt
          # exit 1 = target missed (a result, reported); 2/3 = invalid or refused (plumbing failure)
          [ "$rc" -le 1 ]

      - name: Job summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          print("## bench-product: real fetch-mcp release binary on hosted arm64, ADVISORY (recorded, not gated)\n")
          print("```\n" + open("out/platform-product.txt").read() + "```\n")
          try:
              for l in open("out/results-product.jsonl"):
                  o = json.loads(l)
                  if o.get("kind") == "scenario":
                      v = o.get("samples_kB") or [0]
                      print(f"idle VmRSS: {o['valid_runs']}/{o['runs']} valid, median {o.get('median_MiB','n/a')} MiB, "
                            f"min-max {min(v)/1024:.2f}-{max(v)/1024:.2f} MiB, target 10 MiB, verdict {o['verdict']}\n")
                      t = o.get("timings", {})
                      for k in ("ready_ms", "tools_list_ms"):
                          if k in t:
                              print(f"- {k}: median {t[k]['median']} (min {t[k]['min']}, max {t[k]['max']})")
                      if "ready_ms" in t:
                          m = t["ready_ms"]["median"]
                          print(f"\nreadiness (spawn to initialize result) median {m} ms vs the 250 ms PRD figure: "
                                f"{'within' if m <= 250 else 'ABOVE'} (recorded evidence; the harness does not enforce 250 ms)")
                  elif o.get("kind") == "summary":
                      print(f"\nsummary: {o.get('verdict')} {o.get('reason','')} (gating={o.get('gating')})")
          except OSError as e:
              print(f"no results: {e}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arm-bench-product
          path: out/
          if-no-files-found: warn

  # A-3b native-aarch64 RSS smoke (advisory, not a gate): the real product built with bench-loopback (so the loopback
  # fixture server is reachable), one 5 MiB fetch per fresh process, VmHWM read after the call returned. The binary is
  # kind=bench and is never uploaded as a release artifact. Idle RSS comes from the bench-product job.
  bench-product-peak:
    name: bench-product-peak (fetch-mcp bench-loopback, gnu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Platform facts
        run: |
          set -eu
          mkdir -p out
          {
            echo "machine: $(uname -m)"
            echo "kernel: $(uname -r)"
            echo "cpu: $(grep -m1 -E '^(model name|Model|Hardware|CPU part)' /proc/cpuinfo || true)"
            echo "nproc: $(nproc)"
            echo "MemTotal: $(grep MemTotal /proc/meminfo)"
            echo "PAGESIZE: $(getconf PAGESIZE)"
            echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
          } | tee out/platform-peak.txt

      - run: rustup show active-toolchain

      - name: Build fetch-mcp release with bench-loopback (--locked)
        run: |
          set -eu
          cargo build --release --locked --features bench-loopback
          file target/release/fetch-mcp | tee -a out/platform-peak.txt
          sha256sum target/release/fetch-mcp | tee -a out/platform-peak.txt
          target/release/fetch-mcp --version | tee -a out/platform-peak.txt

      - name: Generate fixtures and self-test the harness
        run: |
          set -eu
          python3 bench/fixtures.py generate
          python3 bench/selftest.py

      - name: 5 MiB fetch VmHWM (advisory, bench/serve.py fixture, 10 fresh processes)
        run: |
          set -u
          : > out/results-peak.jsonl
          rc=0
          python3 bench/measure.py --binary target/release/fetch-mcp --binary-kind bench --scenario g4a-5mib-full \
            --out out/results-peak.jsonl > /dev/null || rc=$?
          echo "peak exit=$rc" | tee out/exitcodes-peak.txt
          # exit 1 = target missed (a result, reported); 2/3 = invalid or refused (plumbing failure)
          [ "$rc" -le 1 ]

      - name: Job summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          print("## bench-product-peak: 5 MiB fetch on hosted arm64, ADVISORY (recorded, not gated)\n")
          print("```\n" + open("out/platform-peak.txt").read() + "```\n")
          try:
              for l in open("out/results-peak.jsonl"):
                  o = json.loads(l)
                  if o.get("kind") == "scenario":
                      v = o.get("samples_kB") or [0]
                      print(f"VmHWM after one 5 MiB fetch: {o['valid_runs']}/{o['runs']} valid, median {o.get('median_MiB','n/a')} MiB, "
                            f"min-max {min(v)/1024:.2f}-{max(v)/1024:.2f} MiB (samples kB {v}), target 40 MiB, verdict {o['verdict']}\n")
                  elif o.get("kind") == "summary":
                      print(f"\nsummary: {o.get('verdict')} {o.get('reason','')} (gating={o.get('gating')})")
          except OSError as e:
              print(f"no results: {e}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arm-bench-product-peak
          path: out/
          if-no-files-found: warn
