name: release

# D-2 (Sprint 9): multi-arch container image build, native per-platform test, and publish (manual gate).
#
# OQ-7 (image distribution / licence decision) is RESOLVED (2026-09-22, owner decision, Sprint 13): open
# source, dual-licensed MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE, `Cargo.toml` `license` field).
# That answers WHAT licence governs distribution; it does not by itself make a tag push auto-publish a
# public image. The `merge` job still pushes only a `candidate-<sha>` reference (never a version tag or
# `latest`) because `imagetools create` requires some registry reference to target (a bare digest cannot
# be a push target) - this is a technical necessity, not a release artifact, and it is immediately
# followed by an automated GHCR package-visibility check (`Assert GHCR package is private (OQ-7 guard)`)
# that FAILS the job if the package is not private, so "candidates stay private until explicitly
# published" is enforced in CI, not just claimed in this comment. The `publish` job below is the only
# path that can add a version tag / make the package public, and it requires a manual, non-`push`-
# triggered `workflow_dispatch` with `confirm_publish=true` in addition to the tag existing (see that
# job) - a bare `git push` of a `v*` tag can never by itself publish anything; a human must separately
# run `workflow_dispatch` with `confirm_publish=true` after the tag exists. Do not weaken that
# `confirm_publish` requirement without an owner decision recorded in the sprint plan.
#
# Trigger: a `v*` tag push (the build/test/candidate path; publishing still needs the separate manual
# confirmation above) and `workflow_dispatch` (so the build/test path can be exercised for CI evidence
# without a real tag; manual runs must NOT supply `confirm_publish=true` unless an actual publish is
# intended and a version tag already exists).
#
# Conventions carried over from ci.yml / bench.yml / D-7: hosted runners only (ubuntu-24.04 amd64,
# ubuntu-24.04-arm arm64; ADR-007), SHA-pinned actions, `--locked` builds, least-privilege token by
# default, no `pull_request_target`, fork code never runs here (there is no `pull_request` trigger at
# all in this workflow).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Add the version tag / latest and make the package public. Requires a v* tag to already exist; the publish job also has its own independent gate (both conjuncts required)."
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # Resolve the lowercase image reference once, so every downstream job derives the exact same
  # value the exact same way. `github.repository` (`P47Phoenix/Fetch`) is mixed-case; OCI/Docker
  # repository names must be all-lowercase, so every job below recomputes `IMAGE` from this output
  # with the same `tr` invocation rather than trusting an un-lowercased `env:` value (BLOCKING-1).
  # ---------------------------------------------------------------------------------------------
  image-ref:
    name: resolve lowercase image reference
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # Per-platform build: native build on the platform's own hosted runner (no QEMU, no cross-compile
  # - D-2 as rewritten builds natively per platform, so cargo-zigbuild/ziglang are NOT needed here;
  # see the Sprint 9 dev report deviation note). Pushes the `shipped` image by digest, UNTAGGED, to a
  # private GHCR package (push-by-digest: no tag reference is created for this push at all).
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (${{ matrix.arch }})
    needs: image-ref
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.image-ref.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { arch: arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # push-by-digest requires the buildx `docker-container` driver, not the default `docker`
      # driver (BLOCKING-2).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Log in to GHCR (least-privilege: packages:write only in this job)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push the shipped candidate by digest (untagged, private)
        id: build
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --platform "${{ matrix.platform }}" \
            --target shipped \
            --build-arg BUILD_KIND=shipped \
            --build-arg FETCH_MCP_COMMIT="${{ github.sha }}" \
            --provenance=false \
            --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true" \
            --metadata-file metadata.json \
            .
          cat metadata.json
          digest=$(python3 -c "import json;print(json.load(open('metadata.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### build (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: \`$digest\` (private, untagged; \`docker pull $IMAGE@$digest\`)" >> "$GITHUB_STEP_SUMMARY"

      # Standard Docker buildx multi-platform digest pattern (BLOCKING-5): each matrix leg writes
      # its digest to its own file rather than a shared job-output key, so there is no last-writer
      # collision between the amd64 and arm64 legs.
      - name: Write digest to file
        run: |
          set -euo pipefail
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------------------------
  # Merge job: creates the manifest list from the two per-platform digests. Still private and never
  # gets the version tag or `latest`. A manifest LIST push needs some registry reference (`imagetools
  # create` cannot target a bare digest); this uses a `candidate-<sha>` reference, which is neither a
  # version tag nor `latest` and is never treated as a release artifact - see the D-2 deviation note
  # in the Sprint 9 dev report. The candidate manifest's own resolved digest (asserted below) is what
  # every downstream job pulls, never the candidate tag.
  # ---------------------------------------------------------------------------------------------
  merge:
    name: merge manifest list
    needs: [image-ref, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.image-ref.outputs.image }}
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      candidate-ref: candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download per-platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Create the manifest list from the two per-platform digests
        id: merge
        run: |
          set -euo pipefail
          cd digests
          files=(*)
          [ "${#files[@]}" -eq 2 ] || { echo "::error::expected exactly 2 digest files, found ${#files[@]}: ${files[*]}"; exit 1; }
          refs=()
          for f in "${files[@]}"; do refs+=("$IMAGE@sha256:$f"); done
          cd ..
          # `imagetools create` needs a registry reference to target; a bare digest cannot itself be
          # a push target. `candidate-<sha>` is a technical necessity of this call, not a release
          # artifact - it is not a version tag, is never treated as a release artifact (see the D-2
          # deviation note in the Sprint 9 dev report), and the visibility guard below makes sure it
          # can never land in a public package.
          ref="$IMAGE:candidate-${{ github.sha }}"
          docker buildx imagetools create -t "$ref" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python3 -c "import json,sys;print(json.load(sys.stdin)['digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### merged manifest list"
            echo "refs: \`${refs[*]}\`"
            echo "manifest list digest: \`$digest\` (private; \`docker pull $IMAGE@$digest\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Assert GHCR package is private (OQ-7 guard)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="$(basename "$IMAGE")"
          owner_type="$(gh api "repos/${{ github.repository }}" --jq .owner.type)"
          if [ "$owner_type" = "Organization" ]; then
            endpoint="orgs/${{ github.repository_owner }}/packages/container/$package"
          else
            endpoint="users/${{ github.repository_owner }}/packages/container/$package"
          fi
          vis=$(gh api "$endpoint" --jq .visibility) \
            || { echo "::error::cannot read GHCR package visibility at $endpoint - failing closed"; exit 1; }
          echo "GHCR package '$package' visibility: $vis"
          [ "$vis" = "private" ] || { echo "::error::GHCR package '$package' visibility is '$vis', not 'private'; OQ-7 forbids any non-private candidate. Failing the run."; exit 1; }

  # ---------------------------------------------------------------------------------------------
  # Per-platform test: pulls the candidate BY DIGEST ONLY, never the candidate tag, on the platform's
  # own native runner.
  # ---------------------------------------------------------------------------------------------
  test:
    name: test (${{ matrix.arch }})
    needs: [image-ref, merge]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image-ref.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, triple: x86_64 }
          - { arch: arm64, os: ubuntu-24.04-arm, triple: aarch64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull the shipped candidate by digest and assert the resolved digest matches
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ needs.merge.outputs.digest }}"
          docker pull "$ref"
          resolved=$(docker inspect "$ref" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          [ "$resolved" = "${{ needs.merge.outputs.digest }}" ] || { echo "::error::resolved digest $resolved != ${{ needs.merge.outputs.digest }}"; exit 1; }
          echo "resolved digest ok: $resolved"

      - name: Non-root user check
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ needs.merge.outputs.digest }}"
          user=$(docker inspect "$ref" --format '{{.Config.User}}')
          [ "$user" = "nonroot:nonroot" ] || { echo "::error::image User is '$user', expected nonroot:nonroot"; exit 1; }

      - name: MCP handshake and tools/list in a clean container
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ needs.merge.outputs.digest }}"
          python3 - "$ref" <<'PY'
          import json, subprocess, sys, time
          ref = sys.argv[1]
          p = subprocess.Popen(["docker", "run", "-i", "--rm", ref],
                                stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
          def send(method, params=None, id=None, notify=False):
              msg = {"jsonrpc": "2.0", "method": method}
              if params is not None: msg["params"] = params
              if not notify: msg["id"] = id
              p.stdin.write(json.dumps(msg) + "\n"); p.stdin.flush()
          def recv():
              line = p.stdout.readline()
              if not line: raise RuntimeError("no response (container exited?)")
              return json.loads(line)
          send("initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "release-test", "version": "0"}}, id=1)
          init = recv()
          assert "result" in init, f"initialize failed: {init}"
          send("notifications/initialized", notify=True)
          send("tools/list", id=2)
          tools = recv()
          names = [t["name"] for t in tools.get("result", {}).get("tools", [])]
          assert names == ["fetch"], f"expected exactly ['fetch'], got {names}"
          p.stdin.close(); p.terminate()
          try: p.wait(timeout=5)
          except subprocess.TimeoutExpired: p.kill()
          print("handshake ok, tools:", names)
          PY

      - name: --version output (crate version, commit, Cargo.lock hash)
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ needs.merge.outputs.digest }}"
          out=$(docker run --rm "$ref" --version)
          echo "$out"
          echo "$out" | grep -Eq '^fetch-mcp [0-9]+\.[0-9]+\.[0-9]+ commit=[0-9a-f]{40} cargo-lock=[0-9a-f]{64}$' \
            || { echo "::error::unexpected --version output: $out"; exit 1; }
          echo "$out" | grep -q "commit=${{ github.sha }}" \
            || { echo "::error::--version commit does not match the checked-out commit ${{ github.sha }}"; exit 1; }

      - name: Extract the shipped binary from the image (for the D-7 guard, ldd and the bench harness)
        run: |
          set -eu
          ref="$IMAGE@${{ needs.merge.outputs.digest }}"
          cid=$(docker create "$ref")
          mkdir -p "$RUNNER_TEMP/img"
          docker cp "$cid:/usr/local/bin/fetch-mcp" "$RUNNER_TEMP/img/fetch-mcp-shipped"
          docker rm "$cid" >/dev/null
          chmod +x "$RUNNER_TEMP/img/fetch-mcp-shipped"

      - name: D-7 release-feature guard (cargo tree + marker grep) on the extracted binary
        run: scripts/check-release-features.sh --binary "$RUNNER_TEMP/img/fetch-mcp-shipped"

      - name: No OpenSSL / native-tls linkage (reuses the D-1 release-ldd-guard pattern; distroless has no shell, so ldd runs on the runner against the extracted binary)
        run: |
          set -euo pipefail
          out=$(ldd "$RUNNER_TEMP/img/fetch-mcp-shipped" 2>&1) || {
            echo "$out"
            echo "ldd could not list dynamic dependencies (e.g. a static binary) - not a linkage finding, see deny.toml instead" >&2
            exit 1
          }
          echo "$out"
          echo "$out" | grep -Ei 'ssl|crypto|native-tls' && { echo "::error::image binary links a disallowed TLS library"; exit 1; } || true

      - name: Build the never-pushed bench-loopback image for this platform (same commit, same base digest)
        run: |
          set -eu
          arch="${{ matrix.arch }}"; [ "$arch" = amd64 ] && plat=linux/amd64 || plat=linux/arm64
          docker buildx build --file Dockerfile --platform "$plat" --target bench \
            --build-arg BUILD_KIND=bench --build-arg FETCH_MCP_COMMIT="${{ github.sha }}" \
            --load -t fetch-mcp-bench:local .
          cid=$(docker create fetch-mcp-bench:local)
          docker cp "$cid:/usr/local/bin/fetch-mcp" "$RUNNER_TEMP/img/fetch-mcp-bench"
          docker rm "$cid" >/dev/null
          chmod +x "$RUNNER_TEMP/img/fetch-mcp-bench"
          "$RUNNER_TEMP/img/fetch-mcp-bench" --version

      - name: Generate fixtures and self-test the harness (reuses bench/ from E-2/E-4)
        run: |
          set -eu
          python3 bench/fixtures.py generate
          python3 bench/selftest.py

      - name: "Idle RSS gate on the SHIPPED image's extracted binary (E-3 target: median of 10, <= 10 MiB strict)"
        run: |
          set -u
          python3 bench/measure.py --gate --binary "$RUNNER_TEMP/img/fetch-mcp-shipped" \
            --binary-kind shipped --scenario idle --peer-binary "$RUNNER_TEMP/img/fetch-mcp-bench" \
            --out "$RUNNER_TEMP/img/idle.jsonl"
          rc=$?
          cat "$RUNNER_TEMP/img/idle.jsonl" || true
          exit $rc

      - name: "Peak RSS gate on the BENCH image's extracted binary (G4a+G4b target: median of 10, <= 40 MiB)"
        run: |
          set -u
          python3 bench/measure.py --gate --binary "$RUNNER_TEMP/img/fetch-mcp-bench" \
            --binary-kind bench --scenario g4a --scenario g4b \
            --peer-binary "$RUNNER_TEMP/img/fetch-mcp-shipped" --out "$RUNNER_TEMP/img/peak.jsonl"
          rc=$?
          cat "$RUNNER_TEMP/img/peak.jsonl" || true
          exit $rc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-test-${{ matrix.arch }}
          path: ${{ runner.temp }}/img/*.jsonl
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Publish job: BLOCKED on OQ-7 (image distribution / licence decision). This job is written to
  # satisfy the D-2 acceptance criteria (it exists, has the right shape and the right permissions)
  # but its `if:` condition is unconditionally false, so it can never run this sprint no matter how
  # this workflow is triggered - including a real `v*` tag push. Do not edit the condition.
  #
  # To unblock this job once the project owner has recorded an OQ-7 decision in the sprint plan, a
  # human must, in its own reviewed PR:
  #   1. remove the leading `false && ` from the `if:` expression below, AND
  #   2. leave (or add) `inputs.confirm_publish == 'true'` as a REQUIRED conjunct that is evaluated
  #      on every trigger type, not only `workflow_dispatch`. A bare `v*` tag push carries no
  #      `inputs` context at all, so the condition must not fall back to "any push is enough" the
  #      way an `||` escape would; the intent is that a real release additionally requires either a
  #      manual `workflow_dispatch` with `confirm_publish=true`, or a repository variable /
  #      environment-based approval (e.g. `environment: release` with required reviewers) recorded
  #      at the same time as the OQ-7 decision. There is deliberately no single-token edit that
  #      unblocks this job — that is the point of the gate.
  #
  # When OQ-7 is eventually decided and this gate is intentionally opened, the job:
  #   - adds the version tag (from the pushed `v*` tag) and, only if OQ-7 says so, `latest`, to the
  #     SAME manifest-list digest `needs.test.result == success` already proved, without rebuilding;
  #   - attaches provenance and SBOM attestations via buildx's native `--provenance`/`--sbom` (no
  #     extra third-party action pinned for this, best-effort, non-blocking for MVP per the AC);
  #   - writes the manifest digest and both per-platform digests into the run summary / release notes.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: publish (manual confirm_publish required)
    needs: [image-ref, build, merge, test]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.image-ref.outputs.image }}
    # OQ-7 (image distribution/licence) is RESOLVED (2026-09-22, owner decision, Sprint 13): open
    # source, dual-licensed MIT OR Apache-2.0 (see LICENSE-MIT, LICENSE-APACHE, Cargo.toml). The
    # `false &&` short-circuit that made this job unreachable regardless of trigger has been removed
    # now that the licence/distribution question is decided — but the safety net is unchanged and
    # MUST NOT be weakened: `inputs.confirm_publish == 'true'` is still a mandatory conjunct, not an
    # either/or with the trigger type, so a bare `v*` tag push can never reach this job on its own.
    # It only runs on a `workflow_dispatch` that explicitly sets `confirm_publish: true` AND the ref
    # is a version tag — i.e. publishing still requires a deliberate, separate, manual confirmation
    # step after the tag exists, never an automatic side effect of pushing the tag.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.confirm_publish == 'true'
    # These permissions are pre-provisioned for this job's steps (version-tag push, provenance/SBOM
    # attestation, release-notes write) - see NB-8 in the PR #13 review.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Tag the passing manifest digest with the version — no rebuild
        run: |
          set -euo pipefail
          digest="${{ needs.merge.outputs.digest }}"
          version="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create -t "$IMAGE:$version" "$IMAGE@$digest"
          # `latest` is intentionally left out here; adding it is a separate follow-up, not implied by
          # OQ-7's licence resolution.
      - name: Provenance / SBOM attestation (best-effort, non-blocking for MVP)
        continue-on-error: true
        run: |
          set -eu
          echo "attestation step placeholder — wire actions/attest-build-provenance and an SBOM generator here"
      - name: "D-6: create the GitHub release with notes linking the benchmark report and both digests"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          digest="${{ needs.merge.outputs.digest }}"
          notes="$(mktemp)"
          {
            echo "## fetch-mcp $version"
            echo
            echo "Memory targets (idle <= 10 MiB, peak <= 40 MiB, both hosted-native aarch64 and amd64, gnu and musl):"
            echo "see [docs/BENCHMARK.md](https://github.com/${{ github.repository }}/blob/$version/docs/BENCHMARK.md)"
            echo "(the D-1 shipped-build re-measure, section 18, is the figure that governs this tag)."
            echo
            echo "Manifest digest: \`$digest\`"
            echo "Image: \`$IMAGE:$version\` (linux/amd64 + linux/arm64)"
            echo
            echo "D-6 AC (dependency audit): \`cargo audit\` and \`cargo deny check\` reported no high/critical"
            echo "issues at this commit (see the \`audit\` and \`deny\` CI jobs); direct dependencies: see Cargo.toml."
          } > "$notes"
          gh release create "$version" --title "fetch-mcp $version" --notes-file "$notes" --verify-tag
