name: bench

# E-2 / E-3 (ADR-007): the memory benchmark on NATIVE GitHub-hosted runners, linux/amd64 (ubuntu-24.04) and linux/arm64
# (ubuntu-24.04-arm), gnu and musl. Hosted only, least-privilege token, no pull_request_target, no secrets, and fork PRs
# are skipped. Every measurement is a `measure.py --gate` run on a native host (the harness refuses QEMU and stand-ins).
#   idle  : shipped release binary, 10 fresh processes, 30 s settle, median <= 10 MiB (strict, no tolerance): E-3.
#   peak  : bench-loopback build, complete G4a set (5 MiB page read to its end and converted, gzipped, late-landmark,
#           50 MiB Content-Length, 50 MiB chunked) AND the complete G4b set (window at start with early stop, window at end,
#           raw=true, chunked window inside the cap, window beyond the cap; A-5, A-6) + redirect-chain5 + g6-concurrent10 +
#           hostile-attrs3 + hostile-attrvalue3 (recorded, never pass/fail; the hostile ones are 3 concurrent fetches of adversarial
#           pages, fix-pass 1), median of 10, gating peak <= 40 MiB and both 50 MiB chunked windows within 10% of the 5 MiB
#           window-at-end peak. Since A-5 the read-to-the-end scenarios are window-at-end requests (a request from offset 0 now
#           stops early), with the window resolved from the binary's own reported length (measure.py resolve_window).
#           G4a passing is not the memory gate closing; G4a and G4b both passing on all cells is (plan: E-7-dependent checks excepted).
#   identity: every --gate run takes --peer-binary and refuses unless shipped and bench report the same commit and Cargo.lock hash.
#   public : advisory shipped-vs-bench fetch of one real public HTTPS page (E-8 cross-check), recorded, never gating.
# The job fails if either gating run misses (exit 1) or is INVALID/INCOMPLETE/refused (exit 2/3). redirect-chain5 has gate "none"
# (excluded from the gating peak figure) but still fails closed on validity and on its own target. The idle-bench step is
# advisory (exit 1 recorded, exit 2/3 fail). An ADVISORY verdict is never a result. NOT a required check until the owner adds it to branch protection (docs/ci-branch-protection.md).
# Not yet: the image-based run (D-2 builds the image; the tag trigger with the digest gate is D-2's).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "bench/**"
      - "src/**"
      - "Cargo.toml"
      - "build.rs"
      - "Cargo.lock"
      - "scripts/build-candidates.sh"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-gate:
    name: bench-gate (${{ matrix.arch }}, ${{ matrix.libc }})
    # Same-repo PRs and trusted events only (no fork code on a runner that measures).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04, libc: gnu, triple: x86_64 }
          - { arch: amd64, os: ubuntu-24.04, libc: musl, triple: x86_64 }
          - { arch: arm64, os: ubuntu-24.04-arm, libc: gnu, triple: aarch64 }
          - { arch: arm64, os: ubuntu-24.04-arm, libc: musl, triple: aarch64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Platform facts (OS, kernel, CPU, RAM, page size, THP, load)
        run: |
          set -eu
          mkdir -p out
          {
            echo "runner: ${RUNNER_NAME:-unknown} arch=${RUNNER_ARCH:-unknown} image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "matrix: ${{ matrix.arch }} ${{ matrix.libc }} on ${{ matrix.os }}"
            echo "uname: $(uname -a)"
            cpu=$( (lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -1) || true)
            [ -n "$cpu" ] || cpu=$(sed -n -E 's/^(model name|Model|Hardware)[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo | head -1)
            impl=$(sed -n -E 's/^CPU implementer[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo | head -1)
            part=$(sed -n -E 's/^CPU part[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo | head -1)
            [ -n "$cpu" ] || cpu="unknown (implementer=${impl:-?} part=${part:-?})"
            echo "cpu: $cpu"
            echo "cpu_id: implementer=${impl:-n/a} part=${part:-n/a} $(lscpu 2>/dev/null | sed -n 's/^Vendor ID:[[:space:]]*/vendor=/p' | head -1)"
            echo "nproc: $(nproc)"
            echo "MemTotal: $(grep MemTotal /proc/meminfo)"
            echo "PAGESIZE: $(getconf PAGESIZE)"
            echo "thp: $(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo unknown)"
            echo "loadavg: $(cat /proc/loadavg)"
            echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "binfmt: $(find /proc/sys/fs/binfmt_misc -type f 2>/dev/null | tr "\n" " ")"
          } | tee out/platform.txt

      - run: rustup show active-toolchain

      - name: Install the pinned cross tools (cargo-zigbuild 0.23.4, ziglang 0.16.0)
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/zigvenv"
          "$RUNNER_TEMP/zigvenv/bin/pip" install --quiet ziglang==0.16.0
          echo "$RUNNER_TEMP/zigvenv/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build the shipped and bench candidates for this native arch (scripts/build-candidates.sh)
        run: scripts/build-candidates.sh "$RUNNER_TEMP/bin"

      - name: Release guard on the shipped candidate, then the bench-marker check
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}"
          scripts/check-release-features.sh --binary "$bin-shipped"
          "$bin-shipped" --version | tee -a out/platform.txt
          "$bin-bench" --version | tee -a out/platform.txt
          file "$bin-shipped" "$bin-bench" | tee -a out/platform.txt
          sha256sum "$bin-shipped" "$bin-bench" | tee -a out/platform.txt

      - name: Generate fixtures and self-test the harness
        run: |
          set -eu
          python3 bench/fixtures.py generate
          python3 bench/selftest.py

      - name: "Conversion overhead of a 1 MiB page (A-4 AC: p95 <= 500 ms on aarch64; BENCHMARK.md section 9 method)"
        if: matrix.libc == 'gnu'
        # pipefail matters: without it `tee` would mask a failing assertion (p95 > 500 ms) and this step could never fail.
        run: |
          set -euo pipefail
          cargo test --locked --release --lib conversion_overhead_1mib -- --ignored --nocapture 2>&1 | tee out/convert-overhead.txt
          # A filter that matches nothing exits 0 ("running 0 tests"), and a missing measurement line must not pass silently:
          # require exactly one test to have run and passed (the filter is specific to it) and its measurement line to exist. (The
          # 'test <name> ... ok' line is not matched, and the measurement is not anchored to line start: with --nocapture
          # stdout and stderr interleave nondeterministically.)
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' out/convert-overhead.txt \
            || { echo "::error::expected exactly 1 test to have run"; exit 1; }
          line=$(grep -oE 'CONVERT_1MIB bytes=.*' out/convert-overhead.txt | head -1 | grep .) \
            || { echo "::error::no CONVERT_1MIB measurement line"; exit 1; }
          echo "convert-overhead: $line" >> "$GITHUB_STEP_SUMMARY"

      - name: "Idle RSS gate (E-3, and the G4b re-check of A-6): shipped binary, median of 10, <= 10 MiB strict"
        id: idle
        continue-on-error: true
        run: |
          set -u
          rc=0
          python3 bench/measure.py --gate --binary "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-shipped" \
            --binary-kind shipped --scenario idle --peer-binary "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-bench" --out out/idle.jsonl > /dev/null || rc=$?
          echo "idle_exit=$rc" | tee -a out/exitcodes.txt
          cat out/idle.jsonl
          exit "$rc"

      - name: Idle RSS of the bench build (recorded, E-8 delta; advisory, only exit 2/3 fail)
        id: idle_bench
        continue-on-error: true
        run: |
          set -u
          rc=0
          python3 bench/measure.py --binary "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-bench" \
            --binary-kind bench --scenario idle-bench --out out/idle-bench.jsonl > /dev/null || rc=$?
          echo "idle_bench_exit=$rc" | tee -a out/exitcodes.txt
          # Advisory (gate "none"): exit 1 (over the idle target) is a recorded result, only 2/3 (plumbing) fail the step.
          [ "$rc" -le 1 ]

      - name: "Peak RSS gate G4a + G4b (E-4, A-5, A-6): bench-loopback build, complete G4a and G4b sets plus redirect-chain5, g6-concurrent10 and the hostile-HTML scenarios (recorded), median of 10, <= 40 MiB"
        id: peak
        continue-on-error: true
        run: |
          set -u
          rc=0
          python3 bench/measure.py --gate --binary "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-bench" \
            --binary-kind bench --scenario g4a --scenario g4b --scenario redirect-chain5 --scenario g6-concurrent10 \
            --scenario hostile-attrs3 --scenario hostile-attrvalue3 \
            --peer-binary "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-shipped" --out out/peak.jsonl > /dev/null || rc=$?
          echo "peak_exit=$rc" | tee -a out/exitcodes.txt
          cat out/peak.jsonl
          exit "$rc"

      - name: "Public-host cross-check (E-8, advisory): shipped vs bench on one real HTTPS page, recorded not gating"
        id: public
        continue-on-error: true
        run: |
          set -u
          rc=0
          python3 bench/public_check.py --shipped "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-shipped" \
            --bench "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-bench" --out out/public.jsonl > /dev/null || rc=$?
          echo "public_exit=$rc" | tee -a out/exitcodes.txt
          cat out/public.jsonl
          exit "$rc"

      - name: Job summary (measured values against targets)
        if: always()
        continue-on-error: true   # reporting must never change the gate outcome
        run: |
          {
            echo "## bench-gate ${{ matrix.arch }} ${{ matrix.libc }}: native ${{ matrix.os }}, hosted runner"
            echo
            echo "idle step: ${{ steps.idle.outcome }}; bench idle step: ${{ steps.idle_bench.outcome }}; peak step: ${{ steps.peak.outcome }}; public-host cross-check (advisory): ${{ steps.public.outcome }} (gating runs, native host; INVALID/INCOMPLETE/refused exit 2/3 also fail the job)"
            echo
            python3 bench/report.py --platform out/platform.txt --idle out/idle.jsonl --idle-bench out/idle-bench.jsonl --peak out/peak.jsonl --public out/public.jsonl \
              --shipped "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-shipped" \
              --bench "$RUNNER_TEMP/bin/fetch-mcp-${{ matrix.triple }}-${{ matrix.libc }}-bench"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-gate-${{ matrix.arch }}-${{ matrix.libc }}
          path: out/
          if-no-files-found: warn

      - name: Fail the job if a gating run missed, was INVALID or INCOMPLETE, or the bench idle run failed
        if: always()
        run: |
          echo "idle=${{ steps.idle.outcome }} idle_bench=${{ steps.idle_bench.outcome }} peak=${{ steps.peak.outcome }}"
          [ "${{ steps.idle.outcome }}" = success ] && [ "${{ steps.peak.outcome }}" = success ] && [ "${{ steps.idle_bench.outcome }}" = success ]
