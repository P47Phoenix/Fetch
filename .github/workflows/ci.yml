name: ci

on:
  pull_request:
  push:
    branches: [main]

# Hosted runners only (D-7). Self-hosted aarch64 jobs are added by E-2/D-2/D-3/E-6.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features bench-loopback -- -D warnings
      - run: cargo clippy --locked --all-targets --features test-support -- -D warnings
      # D-7 AC: the A-1 spike code passes clippy -D warnings. spikes/a1 is a separate crate, so root clippy never covers it.
      - name: Clippy the A-1 spike (default and one feature set per HTTP backend)
        working-directory: spikes/a1
        run: |
          set -eu
          for f in "" http-reqwest,conv-htmd http-reqwest,conv-lolhtml http-hyper,conv-html2md http-ureq,conv-html2text; do
            echo "== spikes/a1 features: '$f'"
            cargo clippy --locked --all-targets --features "$f" -- -D warnings
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo test --locked
      - run: cargo test --locked --features bench-loopback
      - run: cargo test --locked --features test-support
      - name: Bench harness self-test (proves the harness can fail)
        run: python3 bench/selftest.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Guard the release build (cargo tree + marker grep)
        run: scripts/check-release-features.sh
      - name: Guard self-test (positive controls must fail the guard)
        run: scripts/check-release-features.sh --self-test
