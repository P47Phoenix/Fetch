name: ci

on:
  pull_request:
  push:
    branches: [main]

# Hosted runners only (D-7). Self-hosted aarch64 jobs are added by E-2/D-2/D-3/E-6.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features bench-loopback -- -D warnings
      - run: cargo clippy --locked --all-targets --features test-support -- -D warnings
      # D-7 AC: the A-1 spike code passes clippy -D warnings. spikes/a1 is a separate crate, so root clippy never covers it.
      - name: Clippy the A-1 spike (default and one feature set per HTTP backend)
        working-directory: spikes/a1
        run: |
          set -eu
          for f in "" http-reqwest,conv-htmd http-reqwest,conv-lolhtml http-hyper,conv-html2md http-ureq,conv-html2text; do
            echo "== spikes/a1 features: '$f'"
            cargo clippy --locked --all-targets --features "$f" -- -D warnings
          done

  # D-3: unit and integration tests run on both hosted x86_64 and native hosted arm64 (ADR-007; no QEMU
  # substitute for a required check). Either leg failing fails the pipeline (matrix legs are independent
  # required checks by job+matrix name).
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo test --locked
      - run: cargo test --locked --features bench-loopback
      - run: cargo test --locked --features test-support
      - name: Bench harness self-test (proves the harness can fail)
        run: python3 bench/selftest.py
      - name: E-6 regression-tripwire self-test (proves it PASSes/FAILs/advises correctly)
        run: python3 scripts/regression_gate_selftest.py

  # D-1: the release binary links no OpenSSL/native-tls, only libc/libgcc_s/libm (rustls, ADR-001).
  # Scoped to the default (gnu, dynamically linked) target: `ldd` cannot inspect a statically linked (musl)
  # binary at all (it prints "not a dynamic executable" and exits non-zero, which is a fact about linkage
  # mode, not a finding), so it would spuriously fail-closed there. The real backstop against a static TLS
  # library sneaking in on any target is deny.toml's openssl/native-tls/aws-lc bans, checked by the `deny` job.
  release-ldd-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo build --release --locked
      - name: Assert no OpenSSL / native-tls linkage
        run: |
          set -euo pipefail
          out=$(ldd target/release/fetch-mcp 2>&1) || {
            echo "$out"
            echo "ldd could not list dynamic dependencies (e.g. a static binary) - not a linkage finding, see deny.toml instead" >&2
            exit 1
          }
          echo "$out" | tee ldd.txt
          if grep -Ei 'ssl|crypto|native-tls' ldd.txt; then
            echo "release binary links a disallowed TLS library" >&2
            exit 1
          fi

  # B-5: line coverage gate on the SSRF, redirect and pagination modules (>= 90%, table-driven cases only).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov
      - name: Coverage on ssrf, fetch(redirect) and convert::window (pagination) modules
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|/)(main\.rs|server\.rs|obs\.rs|convert/(html|boilerplate)\.rs)$|/spikes/'
          # src/ssrf/differential.rs is excluded: it is a test-only module (every item is a #[test] or a
          # test helper, nothing is called from production code), so including it would pad the "90%
          # combined" figure with guaranteed-100% test code rather than measuring production coverage.
          python3 scripts/coverage_gate.py lcov.info \
            src/ssrf/mod.rs src/ssrf/ranges.rs src/ssrf/resolver.rs \
            src/fetch/mod.rs src/convert/window.rs \
            --min 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  # D-6 AC: "cargo audit ... reports [no] high or critical issues" (open owner item since Sprint 5/8/11 notes:
  # "cargo-audit never run"). deny.toml's [advisories] section already runs RustSec's own advisory-db lookup
  # through cargo-deny, but D-6 names cargo-audit specifically, so this job runs it directly rather than only by
  # proxy through `deny`. Installed by version pin (RustSec ships no first-party GitHub Action we can SHA-pin the
  # way every other step here is pinned), same pattern as cargo-zigbuild/cargo-llvm-cov elsewhere in this repo.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install --locked cargo-audit --version 0.22.2
      - name: "D-6: cargo audit, no high/critical issues (RUSTSEC-... ignores, if ever needed, live in deny.toml)"
        run: cargo audit --deny warnings

  # D-6 AC: "direct dependencies are at most 15" (NFR-05). Machine-checks the [dependencies] table in Cargo.toml
  # (not [dev-dependencies], not the transitive graph) against the ledger comment already kept there by hand.
  dependency-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Count [dependencies] entries in Cargo.toml (NFR-05 <= 15, D-6)
        run: python3 scripts/dependency_count_gate.py Cargo.toml --max 15

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Guard the release build (cargo tree + marker grep)
        run: scripts/check-release-features.sh
      - name: Guard self-test (positive controls must fail the guard)
        run: scripts/check-release-features.sh --self-test

  # A-3b merge gate (EPICS A-3b, sprint plan): the named test `a3b_merge_gate`, the four-refusal tests, the
  # dial-once test and the parser differential, on the shipped (release) profile. Also part of the `test` job on
  # the dev profile; this job exists so the gate is a separately required, separately named check.
  a3b-merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Run the gate tests on the release profile and prove they actually ran
        run: |
          set -euo pipefail
          cargo test --locked --release --lib -- a3b_merge_gate refusal_ dial_once differential b1_every_blocked_class b2_ b3_ 2>&1 | tee gate.log
          for t in a3b_merge_gate refusal_loopback_ip_literal refusal_metadata_ip_literal \
                   refusal_name_resolving_to_a_private_address refusal_redirect_to_a_private_address \
                   dial_once_a_second_private_answer_is_never_looked_up_or_dialled \
                   differential::encodings_corpus differential::every_ipv4_spelling_is_judged_like_the_reference \
                   b1_every_blocked_class_by_name_mixed_and_literal_is_refused_before_any_connection \
                   differential::deterministic_fuzz_corpus \
                   b2_encoded_and_ipv6_forms_are_refused_as_the_request_url \
                   b2_revalidate_hop_refuses_every_loopback_spelling \
                   b3_a_chain_of_five_redirects_succeeds_and_a_chain_of_six_fails \
                   b3_redirect_to_every_encoded_blocked_form_is_refused_without_a_second_connection \
                   b3_a_hung_resolver_is_bounded_by_the_deadline_on_every_hop_and_frees_the_slot; do
            grep -Eq "^test .*${t} \.\.\. ok$" gate.log || { echo "gate test missing or not ok: $t" >&2; exit 1; }
          done
