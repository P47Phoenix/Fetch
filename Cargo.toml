[package]
name = "fetch-mcp"
version = "0.0.0"
edition = "2021"
publish = false
description = "Low-memory MCP fetch server (Sprint 0 skeleton; D-7)"

[features]
default = []
# Compile-time-only, never enabled in a release/tag/distributed artifact.
# Asserted absent by scripts/check-release-features.sh (R12, D-7). The guard fails on ANY feature
# other than `default`, so a new feature must be added to its allowlist deliberately.
# (No fixture-CA feature: BENCHMARK.md sec 8 does not adopt one.)
test-support = []
bench-loopback = []

[dependencies]

# Release profile pinned in D-7 (values from the A-1 spike; architecture sec 9).
# D-1 (Sprint 8) finalises it (opt-level "s" vs 3) and re-measures on aarch64.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
