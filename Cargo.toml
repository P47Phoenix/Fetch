[package]
name = "fetch-mcp"
version = "0.0.0"
edition = "2021"
publish = false
description = "Low-memory MCP fetch server (Sprint 1 skeleton; A-2)"

[features]
default = []
# Compile-time-only, never enabled in a release/tag/distributed artifact.
# Asserted absent by scripts/check-release-features.sh (R12, D-7). The guard fails on ANY feature
# other than `default`, so a new feature must be added to its allowlist deliberately.
# (No fixture-CA feature: BENCHMARK.md sec 8 does not adopt one.)
test-support = []
bench-loopback = []

[dependencies]
# Direct-dependency ledger against NFR-05 (<= 15; architecture sec 14 R13 plans 14). A-2 adds 4 (4 of 15); A-3a adds none (std::net parsing, own range tables; no `url`/`ipnet` crate).
# Versions match spikes/a1/Cargo.lock (architecture sec 9.1). NO HTTP client, TLS or network crate until A-3b.
# 1. rmcp: MCP server, stdio transport, #[tool_router] macros (ADR-001). Exact pin: high-churn 3.x (R5).
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
# 2. tokio: current_thread runtime, minimal features (no "net": nothing here opens a socket). Exact pin (sec 9.1).
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "io-std", "io-util"] }
# 3. serde: FetchParams deserialisation.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# 4. schemars: JSON schema for the tool input (rmcp uses schemars 1.x).
schemars = "1"

[dev-dependencies]
# Test-only, not shipped, not counted against NFR-05: the stdout-purity integration test speaks JSON-RPC.
serde_json = "1"

# Release profile pinned in D-7 (values from the A-1 spike; architecture sec 9).
# D-1 (Sprint 8) finalises it (opt-level "s" vs 3) and re-measures on aarch64.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
