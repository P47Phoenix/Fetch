# cargo-audit configuration (read by the `audit` job in .github/workflows/ci.yml). Keep in step with the
# [advisories] ignore list in deny.toml, which cargo-audit does not read.
[advisories]
# RUSTSEC-2026-0543: chrono is unmaintained (informational notice, no known vulnerability). It reaches us only
# through rmcp and schemars, and every rmcp 3.x release depends on it, so it cannot be dropped by a bump.
# Revisit when rmcp moves off chrono.
ignore = ["RUSTSEC-2026-0543"]
